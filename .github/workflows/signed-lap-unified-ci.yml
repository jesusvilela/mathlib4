name: Signed Laplacian unified contribution verification

on:
  push:
    branches:
      - submission/signed-laplacian-unified
    paths:
      - 'Mathlib/Combinatorics/SimpleGraph/SignedLapMatrix.lean'
      - 'Mathlib.lean'
      - '.github/workflows/signed-lap-unified-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      MATHLIB_CACHE_GET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compile and independently replay the signed Laplacian module
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          test: false
          lint: false
          mk_all-check: true
          leanchecker: true
          leanchecker-args: Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          use-mathlib-cache: true
          use-github-cache: true
      - name: Run Mathlib declaration linter
        run: lake exe runLinter Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
      - name: Require all 19 declared theorem names and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/SignedLapUnifiedAxiomAudit.lean <<'EOF'
          import Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          #print axioms SimpleGraph.signedAdjMatrix_apply
          #print axioms SimpleGraph.signedAdjMatrix_apply_of_adj
          #print axioms SimpleGraph.signedAdjMatrix_apply_self
          #print axioms SimpleGraph.signedLapMatrix_apply_self
          #print axioms SimpleGraph.isSymm_signedAdjMatrix
          #print axioms SimpleGraph.isSymm_signedLapMatrix
          #print axioms SimpleGraph.isHermitian_signedLapMatrix
          #print axioms SimpleGraph.signedAdjMatrix_const_false
          #print axioms SimpleGraph.signedLapMatrix_const_false
          #print axioms SimpleGraph.signedAdjMatrix_const_true
          #print axioms SimpleGraph.signedLapMatrix_const_true
          #print axioms SimpleGraph.signlessLapMatrix_toLinearMap
          #print axioms SimpleGraph.posSemidef_signlessLapMatrix
          #print axioms SimpleGraph.posSemidef_signedLapMatrix_const_true
          #print axioms SimpleGraph.signedAdjMatrix_sq_apply_of_adj
          #print axioms SimpleGraph.signedLapMatrix_toLinearMap
          #print axioms SimpleGraph.posSemidef_signedLapMatrix
          #print axioms SimpleGraph.signedLapMatrix_toLinearMap
          #print axioms SimpleGraph.signedLapMatrix_mulVec_eq_zero_iff_forall_adj
          EOF
          lake env lean /tmp/SignedLapUnifiedAxiomAudit.lean > /tmp/signed-lap-unified-axioms.txt
          cat /tmp/signed-lap-unified-axioms.txt
          count="$(grep -c '^\x27SimpleGraph\.' /tmp/signed-lap-unified-axioms.txt || true)"
          # Verify every declaration exists; Lean errors already fail the command.
          if grep -Eiq 'sorryAx|native_decide|Lean.ofReduceBool' /tmp/signed-lap-unified-axioms.txt; then
            echo 'FAIL: nonstandard axiom in theorem dependencies'
            exit 1
          fi
          echo 'PASS: all named declarations elaborated and no untrusted axioms were found'
      - name: Record source provenance
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "toolchain=$(cat lean-toolchain)"
          lean --version
