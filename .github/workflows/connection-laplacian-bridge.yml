name: Connection Laplacian to Mathlib signed-operator bridge (fork only)

on:
  push:
    branches:
      - research/connection-laplacian-full-port
    paths:
      - '.github/workflows/connection-laplacian-bridge.yml'
      - 'Porting/MathlibBridge.lean'
      - 'ConnectionLaplacian/Basic.lean'
      - 'ConnectionLaplacian/KernelDimension.lean'
      - 'Mathlib/Combinatorics/SimpleGraph/SignedLapMatrix.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connection-laplacian-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-correspondence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MATHLIB_CACHE_GET_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          leanchecker: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Record versions and fail on an admitted bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mathlib-bridge"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "toolchain=$(cat lean-toolchain)"
            lean --version
            lake --version
          } | tee "$RUNNER_TEMP/mathlib-bridge/versions.txt"
          if grep -En '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' Porting/MathlibBridge.lean; then
            echo "FAIL: bridge cannot contain an admitted proof or a local axiom"
            exit 1
          fi

      - name: Build all actual imported modules through Lake
        shell: bash
        run: |
          set -euo pipefail
          lake build Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix ConnectionLaplacian.KernelDimension \
            2>&1 | tee "$RUNNER_TEMP/mathlib-bridge/import-build.log"

      - name: Elaborate and kernel-check the exact matrix identity
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Porting/MathlibBridge.lean \
            2>&1 | tee "$RUNNER_TEMP/mathlib-bridge/bridge.log"
          grep -q 'signedLaplacianMobius_eq_signedLapMatrix' Porting/MathlibBridge.lean
          echo 'PASS: Lean accepted a total, all-finite-graph matrix equality' \
            | tee -a "$RUNNER_TEMP/mathlib-bridge/bridge.log"

      - name: Verify actual filesystem denial before external checking
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo chown root:root /usr/bin/bwrap
          sudo chmod 4755 /usr/bin/bwrap
          test -u /usr/bin/bwrap
          f="$RUNNER_TEMP/mathlib-bridge/host-denial"
          printf 'original\n' > "$f"
          set +e
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc --unshare-net \
            -- bash -c 'printf altered > "$1"' bash "$f" \
            > "$RUNNER_TEMP/mathlib-bridge/sandbox.stdout" \
            2> "$RUNNER_TEMP/mathlib-bridge/sandbox.stderr"
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(cat "$f")" = original
          grep -iq 'read-only file system' "$RUNNER_TEMP/mathlib-bridge/sandbox.stderr"

      - name: Export the proved equality with its transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mathlib-bridge"
          mkdir -p .lake/build/lib/lean/Porting
          lake env lean -o .lake/build/lib/lean/Porting/MathlibBridge.olean \
            Porting/MathlibBridge.lean 2>&1 | tee "$dir/compile-module.log"
          printf '%s\n' 'ConnectionLaplacian.ConnGraph.signedLaplacianMobius_eq_signedLapMatrix' \
            > "$dir/selected-declaration.txt"
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc --unshare-net \
            -- bash -c 'exec lake env leanexport "$1" -- "$2"' bash \
            Porting.MathlibBridge \
            ConnectionLaplacian.ConnGraph.signedLaplacianMobius_eq_signedLapMatrix \
            > "$dir/bridge-theorem.ndjson" \
            2> "$dir/export.stderr"
          test -s "$dir/bridge-theorem.ndjson"
          {
            echo "bridge_source_blob=$(git hash-object Porting/MathlibBridge.lean)"
            echo "signed_mathlib_blob=$(git hash-object Mathlib/Combinatorics/SimpleGraph/SignedLapMatrix.lean)"
            wc -c "$dir/bridge-theorem.ndjson"
          } | tee -a "$dir/versions.txt"

      - name: Require all bundled independent kernels to accept the exact bridge
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mathlib-bridge"
          lake check --paranoid --from-export="$dir/bridge-theorem.ndjson" \
            2>&1 | tee "$dir/check.log"
          for checker in 'Lean paranoid' lean4lean nanoda con-leche con-ron 'Lean default'; do
            grep -Fq "$checker kernel accepts the solution" "$dir/check.log" || {
              echo "FAIL: missing acceptance from $checker on exact bridge"
              exit 1
            }
          done
          echo 'PASS: all six checkers accepted the original-to-Mathlib matrix equality' \
            | tee -a "$dir/check.log"

      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-operator-bridge
          path: ${{ runner.temp }}/mathlib-bridge/
          if-no-files-found: warn
          retention-days: 90
