name: Signed Laplacian upstream-base verification

on:
  push:
    branches:
      - verification/signed-lap-upstream
    paths:
      - 'Mathlib/Combinatorics/SimpleGraph/SignedLapMatrix.lean'
      - 'Mathlib.lean'
      - '.github/workflows/signed-lap-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-laplacian:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Empty explicitly unsets lean-action's legacy flat URL: let current Mathlib
    # resolve the public 'master' then 'forks' cache containers by file hash.
    env:
      MATHLIB_CACHE_GET_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean, fetch Mathlib cache, and compile the signed Laplacian
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          test: false
          lint: false
          mk_all-check: true
          leanchecker: true
          leanchecker-args: Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          use-mathlib-cache: true
          use-github-cache: true
      - name: Lint signed-Laplacian declarations against Mathlib rules
        run: lake exe runLinter Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
      - name: Report transitive axioms of the signed-Laplacian theorems
        shell: bash
        run: |
          cat > /tmp/SignedLapAxiomAudit.lean <<'EOF'
          import Mathlib.Combinatorics.SimpleGraph.SignedLapMatrix
          #print axioms SimpleGraph.signedLapMatrix_toLinearMap₂'
          #print axioms SimpleGraph.posSemidef_signedLapMatrix
          #print axioms SimpleGraph.signedLapMatrix_toLinearMap₂'_eq_zero_iff_forall_adj
          #print axioms SimpleGraph.signedLapMatrix_mulVec_eq_zero_iff_forall_adj
          EOF
          lake env lean /tmp/SignedLapAxiomAudit.lean | tee /tmp/signed-laplacian-axioms.txt
          if grep -Eq 'sorryAx|Lean.ofReduceBool|native_decide' /tmp/signed-laplacian-axioms.txt; then
            echo 'Nonstandard proof bypass detected in transitive axioms'
            exit 1
          fi
